<!--
  FTL Stat Card — Indiana Fever brand palette
  Design reference: DESIGN.md

  Data:
    stat-number: big top-line figure  e.g. "342 ASSISTS"
    stat-label:  descriptor            e.g. "WNBA ALL-TIME RECORD"
-->
<div id="stat-card" data-composition-id="stat-card"
     data-start="0" data-duration="6" data-width="1920" data-height="1080">

  <style>
    /* ── Palette (from DESIGN.md) ──────────────────────────────────────────── */
    #stat-card {
      --bg-deep:  #010b1f;
      --bg-mid:   #021530;
      --gold:     #ffe000;
      --red:      #c8102e;
      --navy:     #002d62;
      --fg:       #ffffff;
      --fg-muted: #9aadca;
    }

    /* ── Background ─────────────────────────────────────────────────────────── */
    #sc-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-mid) 100%);
    }

    /* Radial glow — gold tint, low opacity */
    #sc-glow {
      position: absolute;
      width: 1000px; height: 800px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(255,199,44,0.10) 0%, transparent 70%);
      top: 50%; left: 45%;
      transform: translate(-50%, -50%);
    }

    /* Ghost word — structural depth layer, barely visible */
    #sc-ghost {
      position: absolute;
      bottom: -100px; right: -20px;
      font-size: 360px;
      font-weight: 900;
      color: rgba(255,199,44,0.04);
      font-family: system-ui, -apple-system, sans-serif;
      letter-spacing: -14px;
      line-height: 1;
      user-select: none;
    }

    /* ── Content zone — flex, not absolute coords ──────────────────────────── */
    #sc-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 0 200px;
      box-sizing: border-box;
    }

    /* Accent bar — sweeps in via scaleX from left */
    #sc-bar {
      width: 100px;
      height: 6px;
      background: var(--gold);
      border-radius: 3px;
      transform-origin: left center;
      transform: scaleX(0);
      margin-bottom: 36px;
    }

    #sc-number {
      font-size: 152px;
      font-weight: 900;
      color: var(--fg);
      font-family: system-ui, -apple-system, sans-serif;
      letter-spacing: -5px;
      line-height: 1;
      opacity: 0;
      margin-bottom: 30px;
    }

    #sc-label {
      font-size: 32px;
      font-weight: 700;
      color: var(--gold);
      font-family: system-ui, -apple-system, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0;
    }

    /* Bottom stripe */
    #sc-stripe {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--red) 0%, var(--gold) 50%, var(--navy) 100%);
    }
  </style>

  <!-- Layer 0: background -->
  <div id="sc-bg" class="clip" data-start="0" data-duration="6" data-track-index="0">
    <div id="sc-glow"></div>
    <div id="sc-ghost">STAT</div>
  </div>

  <!-- Layer 1: content zone -->
  <div id="sc-content" class="clip" data-start="0" data-duration="6" data-track-index="1">
    <div id="sc-bar"></div>
    <div id="sc-number">342 ASSISTS</div>
    <div id="sc-label">WNBA ALL-TIME RECORD</div>
  </div>

  <!-- Layer 2: bottom stripe -->
  <div id="sc-stripe" class="clip" data-start="0" data-duration="6" data-track-index="2"></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Offset start — never fire at t=0
    // 1. Gold bar sweeps in from left
    tl.to("#sc-bar", { scaleX: 1, duration: 0.35, ease: "power4.out" }, 0.12);

    // 2. Number: gravity entrance (scale + opacity) — expo.out snaps it in
    tl.fromTo("#sc-number",
      { opacity: 0, scale: 0.86 },
      { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out" },
      0.28
    );

    // 3. Label: slides up — different ease from number
    tl.fromTo("#sc-label",
      { opacity: 0, y: 18 },
      { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" },
      0.58
    );

    // Ambient: slow glow breathe — finite repeat (6s total / 3s per cycle = 1 full cycle)
    tl.to("#sc-glow", { scale: 1.1, opacity: 0.8, duration: 3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

    window.__timelines["stat-card"] = tl;
  </script>
</div>
